name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Unit tests
        run: go test ./...

      - name: Vet
        run: go vet ./...

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Docker integration environment
        run: |
          cd examples/docker
          sudo ./build.sh

      - name: Run integration smoke test
        run: |
          cd examples/docker
          ./ci-smoke.sh

      - name: Collect compose logs
        if: always()
        run: |
          cd examples/docker
          docker compose ps
          docker compose logs --no-color > ../../compose.log || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compose-logs
          path: compose.log

      - name: Cleanup
        if: always()
        run: |
          cd examples/docker
          docker compose down -v --remove-orphans || true
          sudo rm -rf /etc/conduit

  containers:
    name: Build and publish ${{ matrix.image }}
    needs:
      - unit
      - integration
    runs-on: ubuntu-latest

    # Don't publish anything from pull requests.
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io

    strategy:
      matrix:
        image: [server, runner, cli, mcp]

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate container metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/lanl/conduit-${{ matrix.image }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
