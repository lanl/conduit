general_settings:
  store_model_in_db: true

mcp_servers:
  conduit:
    url: "http://conduit-mcp:8081/mcp"
    transport: "http"
    description: "Conduit MCP server"

    auth_type: oauth_delegate
    dcr_bridge: true

    # Upstream OAuth used to obtain the actual ZITADEL token
    # that will be forwarded to conduit-mcp.
    oauth2_flow: authorization_code

    client_id: os.environ/LITELLM_CONDUIT_OAUTH_CLIENT_ID
    client_secret: os.environ/LITELLM_CONDUIT_OAUTH_CLIENT_SECRET

    authorization_url: "https://zitadel.home.arpa/oauth/v2/authorize"
    token_url: "https://zitadel.home.arpa/oauth/v2/token"

    scopes:
      - openid
      - profile
      - email
      - offline_access
      - os.environ/LITELLM_CONDUIT_AUDIENCE_SCOPE

    allow_all_keys: false
